name: Bug report
description: Something capybar shows or does wrong
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you saw, where on the screen, and a screenshot if it shows the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. With capybar running …
        2. Click …
  - type: input
    id: terminal
    attributes:
      label: macOS version and Mac
      placeholder: macOS 15.4 on an M2
  - type: input
    id: version
    attributes:
      label: capybar version
      description: "`~/.local/bin/capybar --version`"
      placeholder: 0.2.0
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: What capybar logged
      description: "`log show --last 1h --predicate 'subsystem == \"com.illinifellow.capybar\"'`"
      render: text
